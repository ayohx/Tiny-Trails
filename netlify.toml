# Netlify Configuration for Tiny Trails
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command - uses expo export for web
  command = "npm run build:web"
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"
  
  # Base directory for the build (root of the project)
  base = "/"

# Build environment variables
[build.environment]
  # Node version
  NODE_VERSION = "18"
  
  # NPM version (optional)
  # NPM_VERSION = "9"

# Headers for security and optimization
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache control
    Cache-Control = "public, max-age=31536000, immutable"

# Special headers for HTML files (shorter cache)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Special headers for service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects and rewrites
[[redirects]]
  # Spa fallback - redirect all routes to index.html
  from = "/*"
  to = "/index.html"
  status = 200
  
# Optional: Deploy Preview settings
[context.deploy-preview]
  command = "npm run build:web"

# Optional: Branch deploy settings  
[context.branch-deploy]
  command = "npm run build:web"

# Optional: Dev environment (if using Netlify Dev locally)
[context.dev]
  command = "npm start"
  targetPort = 8081
  autoLaunch = false
